# Committed on purpose: this is configuration, not secrets. Only
# .streamlit/secrets.toml is gitignored.

[client]
# Back to redacted now the import error is understood. Full tracebacks print
# internal paths and local values on a page anyone with the link can open, and
# that is not a standing trade worth making for a dashboard that is usually
# working. When something does break, set this to "full", push, read the real
# message, and set it back — which is exactly how the last one was diagnosed.
showErrorDetails = "stacktrace"

[server]
# Nothing here writes to the filesystem, so there is nothing to protect against
# a restart; this just avoids the noisy warning about a missing watchdog.
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[theme]
# Dark, for everyone, always. This is a training dashboard read early and late,
# mostly on a phone; the charts, the zone colours and the heart-rate palette were
# all chosen against a dark page. The light variant was never designed, only
# tolerated, and it showed. Set here rather than left to the browser so a viewer
# whose system is light still gets the app as built.
base = "dark"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1f2b"
textColor = "#e6e8ec"
